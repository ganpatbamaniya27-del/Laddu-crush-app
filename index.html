  <body class="bg-[#0b0416] text-amber-100 antialiased overflow-x-hidden selection:bg-amber-400 selection:text-amber-950">

        window.addEventListener('load', () => {

        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
