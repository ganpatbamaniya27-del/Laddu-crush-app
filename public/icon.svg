<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4a1236" />
      <stop offset="50%" stop-color="#240819" />
      <stop offset="100%" stop-color="#0b0314" />
    </radialGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="25%" stop-color="#FFE066" />
      <stop offset="60%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#B87300" />
    </linearGradient>

    <!-- Laddu Texture Gradient -->
    <radialGradient id="ladduGrad" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#FFF3A8" />
      <stop offset="30%" stop-color="#FFB800" />
      <stop offset="70%" stop-color="#E66A00" />
      <stop offset="100%" stop-color="#7A2200" />
    </radialGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners for squircle/adaptive icon -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer Gold Filigree Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="14 10" opacity="0.6" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8" />

  <!-- Outer Glow halo -->
  <circle cx="256" cy="268" r="145" fill="#FFB800" opacity="0.25" filter="url(#glow)" />

  <!-- Shadow below laddu -->
  <ellipse cx="256" cy="410" rx="140" ry="32" fill="#000000" opacity="0.6" />

  <!-- Main Royal Motichoor Laddu Sphere -->
  <circle cx="256" cy="275" r="135" fill="url(#ladduGrad)" stroke="#FFD700" stroke-width="4" />

  <!-- Motichoor Boondi texture sparkles & pearls -->
  <g fill="#FFF5B8" opacity="0.85">
    <circle cx="210" cy="210" r="12" />
    <circle cx="240" cy="190" r="9" />
    <circle cx="180" cy="250" r="10" />
    <circle cx="225" cy="260" r="14" />
    <circle cx="280" cy="220" r="11" />
    <circle cx="310" cy="260" r="13" />
    <circle cx="270" cy="285" r="15" />
    <circle cx="215" cy="315" r="12" />
    <circle cx="260" cy="345" r="14" />
    <circle cx="320" cy="320" r="10" />
    <circle cx="180" cy="320" r="8" />
  </g>

  <!-- Pistachio & Saffron Slivers -->
  <g fill="#38A169" opacity="0.9">
    <ellipse cx="230" cy="235" rx="4" ry="12" transform="rotate(35 230 235)" />
    <ellipse cx="295" cy="245" rx="3.5" ry="11" transform="rotate(-25 295 245)" />
    <ellipse cx="250" cy="310" rx="4" ry="10" transform="rotate(65 250 310)" />
  </g>
  <g fill="#E53E3E" opacity="0.85">
    <path d="M 270 200 Q 275 220 285 225" stroke="#C53030" stroke-width="3" fill="none" />
    <path d="M 200 280 Q 215 290 220 305" stroke="#C53030" stroke-width="3" fill="none" />
  </g>

  <!-- Royal Imperial Crown on top of Laddu -->
  <g transform="translate(166, 75)" filter="url(#glow)">
    <!-- Crown Base -->
    <path d="M 15 80 L 165 80 L 160 92 L 20 92 Z" fill="url(#goldGrad)" stroke="#8A5A00" stroke-width="2" />
    <!-- Crown Jewels on base -->
    <circle cx="45" cy="86" r="4" fill="#E53E3E" />
    <circle cx="90" cy="86" r="5" fill="#3182CE" />
    <circle cx="135" cy="86" r="4" fill="#38A169" />
    <!-- Crown Peaks -->
    <path d="M 15 80 L 10 35 L 45 60 L 90 10 L 135 60 L 170 35 L 165 80 Z" fill="url(#goldGrad)" stroke="#8A5A00" stroke-width="2" />
    <!-- Pearls on Crown tips -->
    <circle cx="10" cy="35" r="7" fill="#FFFFFF" stroke="#FFD700" stroke-width="2" />
    <circle cx="90" cy="10" r="11" fill="#FFFFFF" stroke="#FFD700" stroke-width="3" />
    <circle cx="170" cy="35" r="7" fill="#FFFFFF" stroke="#FFD700" stroke-width="2" />
  </g>

  <!-- Big Star Sparkles -->
  <g fill="#FFFDF0" filter="url(#glow)">
    <!-- Sparkle Top Left -->
    <path d="M 85 110 Q 85 135 60 135 Q 85 135 85 160 Q 85 135 110 135 Q 85 135 85 110 Z" />
    <!-- Sparkle Top Right -->
    <path d="M 425 140 Q 425 160 405 160 Q 425 160 425 180 Q 425 160 445 160 Q 425 160 425 140 Z" />
  </g>
</svg>
